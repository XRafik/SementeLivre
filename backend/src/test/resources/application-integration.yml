spring:
  mail:
    host: localhost
  jpa:
    hibernate:
      ddl-auto: none
    show-sql: false
  flyway:
    enabled: true

# O JwtService não tem mais valor padrão para a chave (#131). Esta é só dos
# testes; em produção ela vem de JWT_SECRET (application-prod.yml).
jwt:
  secret: chaveSomenteParaOsTestesDeIntegracaoComMaisDe256Bits0123456789

app:
  cors:
    allowed-origins:
      - http://localhost:3000
      - http://localhost:3001
