spring:
  datasource:
    url: ${DB_URL:${SPRING_DATASOURCE_URL:jdbc:postgresql://db:5432/semente_prod}}
    username: ${DB_USERNAME:${SPRING_DATASOURCE_USERNAME:semente_user}}
    # Sem valor padrão: sem DB_PASSWORD a aplicação não sobe com uma senha conhecida
    password: ${DB_PASSWORD:${SPRING_DATASOURCE_PASSWORD}}
  jpa:
    hibernate:
      ddl-auto: none
    open-in-view: false
  flyway:
    enabled: true
  servlet:
    multipart:
      max-file-size: 5MB
      max-request-size: 5MB

jwt:
  secret: ${JWT_SECRET}
  expiration: ${JWT_EXPIRATION:1800000}

logging:
  level:
    root: WARN
    com.sementelivre.backend: INFO

management:
  endpoints:
    web:
      exposure:
        include: health, prometheus
  endpoint:
    health:
      show-details: never

app:
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:}
    