spring:
  profiles:
    default: dev
  # SMTP para os e-mails (recuperação de senha, cópia do pedido).
  # Sem MAIL_USERNAME e MAIL_PASSWORD nenhum e-mail é enviado.
  # Os valores ficam em backend/.env (ver backend/.env.example), fora do git.
  mail:
    host: ${MAIL_HOST:smtp.gmail.com}
    port: ${MAIL_PORT:587}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true
          connectiontimeout: 10000
          timeout: 10000
          writetimeout: 10000

management:
  # E-mail é opcional: SMTP fora do ar ou sem credencial não deixa a aplicação DOWN
  health:
    mail:
      enabled: false
  endpoint:
    health:
      probes:
        enabled: true
  metrics:
    tags:
      application: semente-livre

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    disable-swagger-default-url: true
    urls-primary-name: Semente Livre API

app:
  cors:
    allowed-origins: []
  mail:
    # Remetente; vazio usa o MAIL_USERNAME
    from: ${MAIL_FROM:}
  # Pedido do site público (sem login): limites contra spam de pedidos e de e-mails.
  # Acima do limite a API responde 429 com Retry-After.
  pedido-publico:
    limite:
      por-email: ${PEDIDO_PUBLICO_LIMITE_POR_EMAIL:3}
      janela-email: ${PEDIDO_PUBLICO_JANELA_EMAIL:1h}
      por-ip: ${PEDIDO_PUBLICO_LIMITE_POR_IP:10}
      janela-ip: ${PEDIDO_PUBLICO_JANELA_IP:10m}
  # Rotas abertas de /auth (#200), contra força bruta. Acima do limite, 429 com Retry-After.
  # As janelas e os demais padrões estão em LimiteAutenticacaoProperties.
  auth:
    limite:
      login-por-ip:
        limite: ${AUTH_LIMITE_LOGIN_POR_IP:30}
      senha-errada-por-email:
        limite: ${AUTH_LIMITE_SENHA_ERRADA_POR_EMAIL:10}
      refresh-por-ip:
        limite: ${AUTH_LIMITE_REFRESH_POR_IP:120}
      cadastro-por-ip:
        limite: ${AUTH_LIMITE_CADASTRO_POR_IP:20}
