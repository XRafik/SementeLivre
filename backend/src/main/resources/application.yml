spring:
  profiles:
    default: dev
  # SMTP para os e-mails (recuperação de senha, cópia do pedido).
  # Sem MAIL_USERNAME e MAIL_PASSWORD nenhum e-mail é enviado.
  # Os valores ficam em backend/.env (ver backend/.env.example), fora do git.
  mail:
    host: ${MAIL_HOST:smtp.gmail.com}
    port: ${MAIL_PORT:587}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true
          connectiontimeout: 10000
          timeout: 10000
          writetimeout: 10000

management:
  # E-mail é opcional: SMTP fora do ar ou sem credencial não deixa a aplicação DOWN
  health:
    mail:
      enabled: false
  endpoint:
    health:
      probes:
        enabled: true
  metrics:
    tags:
      application: semente-livre

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    disable-swagger-default-url: true
    urls-primary-name: Semente Livre API

app:
  cors:
    allowed-origins: []
  mail:
    # Remetente; vazio usa o MAIL_USERNAME
    from: ${MAIL_FROM:}
