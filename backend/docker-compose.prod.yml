services:
  db:
    image: postgres:15-alpine
    container_name: semente_livre_db_prod
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${DB_USER:-semente_user}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-semente_pass}
      POSTGRES_DB: ${DB_NAME:-semente_prod}
    volumes:
      - postgres_data_prod:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-semente_user} -d ${DB_NAME:-semente_prod}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - app-network

  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: semente_livre_app_prod
    restart: unless-stopped
    environment:
      SPRING_PROFILES_ACTIVE: prod
      SPRING_DATASOURCE_URL: jdbc:postgresql://db:5432/${DB_NAME:-semente_prod}
      SPRING_DATASOURCE_USERNAME: ${DB_USER:-semente_user}
      SPRING_DATASOURCE_PASSWORD: ${DB_PASSWORD:-semente_pass}
      # E-mail (cópia do pedido, recuperação de senha). Valores em backend/.env;
      # sem MAIL_USERNAME/MAIL_PASSWORD nenhum e-mail é enviado.
      MAIL_HOST: ${MAIL_HOST:-smtp.gmail.com}
      MAIL_PORT: ${MAIL_PORT:-587}
      MAIL_USERNAME: ${MAIL_USERNAME:-}
      MAIL_PASSWORD: ${MAIL_PASSWORD:-}
      MAIL_FROM: ${MAIL_FROM:-}
    ports:
      - "8080:8080"
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:8080/actuator/health"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - app-network

volumes:
  postgres_data_prod:

networks:
  app-network:
    driver: bridge